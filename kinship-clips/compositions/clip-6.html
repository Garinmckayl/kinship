        const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        // 0.0 - 1.8s: archival card with book icon animates into view

        // 1.8 - 3.5s: teal soundwave pulses gently + real-time typewriter memory text

        const FULL = "My father used to wake up at 4 AM to start the ovens";
        const typedEl = document.getElementById("typed");
        const tw = { n: 0 };
        tl.to(tw, {
          n: FULL.length,
          duration: 1.7,
          ease: "none",
          onUpdate: () => {
            typedEl.textContent = FULL.slice(0, Math.round(tw.n));
          },
        }, 1.8);
        // gentle waveform pulse: each bar breathes 5 iterations (finite), ending tall
        tl.fromTo(
          ".bars span",
          { scaleY: 0.35 },
          { scaleY: 1, duration: 0.42, ease: "sine.inOut", stagger: 0.055, repeat: 4, yoyo: true },
